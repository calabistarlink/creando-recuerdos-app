<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitparty</title>
<meta name="description" content="Adivina el año de cada canción y arma tu línea de tiempo musical con tus amigos, desde el teléfono.">
<meta name="theme-color" content="#14102B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitparty">
<style>
:root{
  color-scheme:dark;
  --bg:#14102B; --surface:#1F1A40; --surface-2:#2A2455; --ink:#F4F1FF; --muted:#B5AEDB; --line:#3A3370;
  --accent:#FF4FA3; --accent-2:#FFD23F; --good:#4CE0A0; --bad:#FF7A6B; --on-accent:#1A0B1F;
  --gut:16px; --r:16px;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:520px;margin:0 auto;padding:0 var(--gut)}
h1{font-size:30px;margin:20px 0 4px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:26px 0 10px}
p.sub{margin:0;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:10px 16px;background:var(--surface-2);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.primary{background:var(--accent);color:var(--on-accent);font-size:18px;min-height:54px;width:100%}
.ghost{background:transparent;border:1px solid var(--line)}
.card{background:var(--surface);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 12px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--surface);border:1px solid var(--line);text-align:left;padding:12px}
.seg button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.seg small{display:block;font-weight:400;color:var(--muted)}
.field{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.count{font-size:14px;color:var(--muted);text-align:center;margin:10px 0}
.count b{color:var(--accent-2)}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
details{background:var(--surface);border-radius:var(--r);padding:0 14px}
summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details>div{padding-bottom:14px}
.mini{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.mini li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.mini button{min-height:36px;padding:4px 10px}
/* partida */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px}
.score{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pill{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.pill.on{background:var(--accent-2);color:#2A2200;border-color:var(--accent-2);font-weight:700}
.turn{text-align:center;margin:8px 0 14px}
.turn small{color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-size:12px}
.turn h2{margin:2px 0 0;font-size:30px;text-transform:none;letter-spacing:-.5px;color:var(--ink)}
.player{background:linear-gradient(145deg,var(--accent),#7B4DFF);border-radius:24px;padding:22px;text-align:center;color:#fff}
.player .q{font-size:64px;font-weight:800;line-height:1}
.playbtn{width:84px;height:84px;border-radius:50%;background:#fff;color:#7B2CBF;font-size:34px;padding:0;margin:10px auto 6px;display:grid;place-items:center}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:#fff}
.note{font-size:13px;color:rgba(255,255,255,.85)}
.tl{display:grid;gap:6px;margin:16px 0}
.song{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;border-left:6px solid var(--accent-2)}
.song .y{font-size:26px;font-weight:800;color:var(--accent-2);min-width:64px}
.song b{display:block}
.song{text-align:left}
.song small{color:var(--muted)}
.slot{min-height:44px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-weight:600;border-radius:12px}
.slot[aria-pressed=true]{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.yr{display:grid;gap:12px;margin:18px 0}
.yr .big{display:flex;align-items:center;gap:10px;justify-content:center}
.yr input[type=number]{font-size:44px;font-weight:800;text-align:center;width:170px;min-height:68px;color:var(--accent-2)}
.yr .big button{width:56px;height:56px;font-size:26px;padding:0;border-radius:50%}
.yr input[type=range]{width:100%;accent-color:var(--accent)}
.reveal{text-align:center}
.reveal img{width:160px;height:160px;border-radius:16px;object-fit:cover;background:var(--surface-2)}
.reveal .y{font-size:56px;font-weight:800;color:var(--accent-2);line-height:1.1;margin-top:8px}
.reveal h3{margin:4px 0 0;font-size:22px}
.res{margin:14px 0;padding:12px;border-radius:14px;font-weight:700;font-size:18px}
.res.ok{background:rgba(76,224,160,.16);color:var(--good)}
.res.no{background:rgba(255,122,107,.16);color:var(--bad)}
.rank{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px}
.rank li{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:14px;font-size:18px}
.rank li:first-child{background:var(--accent-2);color:#2A2200;font-weight:800}
.rank .n{font-weight:800;width:28px}
.rank .p{margin-left:auto;font-weight:800}
.warn{background:rgba(255,210,63,.12);border:1px solid var(--accent-2);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
a{color:var(--accent-2)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
.stick{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);margin-top:12px}
</style>
</head>
<body>
<main id="app"></main>
<audio id="aud" preload="auto" playsinline></audio>
<script src="songs.js"></script>
<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const DECADES = [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];

/* ---------- estado ---------- */
const DEFAULTS = { players: ['Jugador 1', 'Jugador 2'], mode: 'timeline', target: 8, rounds: 5, from: 1950, to: 2025, langs: [], genres: [], noRepeat: true, useCustom: true };
let S = Object.assign({}, DEFAULTS, lsGet('hp_settings', {}));
let custom = lsGet('hp_custom', []);          // canciones propias
let seen = new Set(lsGet('hp_seen', []));     // ya jugadas en partidas anteriores
let G = lsGet('hp_game', null);               // partida en curso
let view = G ? (G.over ? 'end' : 'game') : 'setup';
let audioState = { id: null, status: 'idle', url: null, art: null }; // idle|loading|ready|none

const saveS = () => lsSet('hp_settings', S);
const saveG = () => lsSet('hp_game', G);
const allSongs = () => SONGS.concat(S.useCustom ? custom : []);
function pool() {
  return allSongs().filter(s => s.year >= S.from && s.year <= S.to &&
    (!S.langs.length || S.langs.includes(s.lang)) && (!S.genres.length || S.genres.includes(s.genre)));
}
const needed = () => S.mode === 'timeline' ? S.players.length * (S.target + 2) : S.players.length * S.rounds;

/* ---------- audio: vista previa de 30 s vía iTunes Search (sin clave) ---------- */
const aud = $('#aud');
const prevCache = lsGet('hp_prev', {});
async function lookup(song) {
  if (prevCache[song.id]) return prevCache[song.id];
  const nt = norm(song.title), na = norm(song.artist).split(' ').filter(w => w.length > 2);
  for (const country of ['US', 'ES']) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=10&country=' + country +
        '&term=' + encodeURIComponent(song.title + ' ' + song.artist), { signal: ctl.signal });
      clearTimeout(t);
      const j = await r.json();
      const hit = (j.results || []).find(x => x.previewUrl && (() => {
        const t2 = norm(x.trackName), a2 = norm(x.artistName);
        return (t2.includes(nt) || nt.includes(t2)) && (!na.length || na.some(w => a2.includes(w)));
      })());
      if (hit) {
        prevCache[song.id] = { url: hit.previewUrl, art: (hit.artworkUrl100 || '').replace('100x100', '300x300') };
        lsSet('hp_prev', prevCache); return prevCache[song.id];
      }
    } catch {}
  }
  return null;
}
async function loadAudio(song) {
  audioState = { id: song.id, status: 'loading' }; aud.pause(); aud.removeAttribute('src');
  paintAudio();
  const p = await lookup(song);
  if (audioState.id !== song.id) return;
  if (p) { audioState = { id: song.id, status: 'ready', url: p.url, art: p.art }; aud.src = p.url; }
  else audioState = { id: song.id, status: 'none' };
  paintAudio();
}
function paintAudio() {
  const b = $('#play'), n = $('#anote'); if (!b) return;
  const st = audioState.status;
  b.textContent = st === 'loading' ? '…' : (aud.paused ? '▶' : '❚❚');
  b.disabled = st !== 'ready';
  b.setAttribute('aria-label', aud.paused ? 'Reproducir' : 'Pausar');
  n.textContent = st === 'loading' ? 'Buscando el audio…' : st === 'none' ? 'No encontré audio para esta canción.' : aud.paused ? 'Toca para escuchar (30 s)' : 'Sonando…';
  $('#skip').hidden = st !== 'none';
}
aud.addEventListener('play', paintAudio); aud.addEventListener('pause', paintAudio); aud.addEventListener('ended', paintAudio);
aud.addEventListener('timeupdate', () => { const i = $('#bar'); if (i && aud.duration) i.style.width = (aud.currentTime / aud.duration * 100) + '%'; });
aud.addEventListener('error', () => { audioState.status = 'none'; paintAudio(); });

/* ---------- lógica de partida ---------- */
function startGame() {
  let ps = pool();
  if (S.noRepeat) { const fresh = ps.filter(s => !seen.has(s.id)); if (fresh.length >= needed()) ps = fresh; }
  const q = shuffle(ps).map(s => s.id);
  const byId = Object.fromEntries(allSongs().map(s => [s.id, s]));
  G = { mode: S.mode, target: S.target, rounds: S.rounds, from: S.from, to: S.to, queue: q, byId: {}, over: false, turn: 0, phase: 'play',
        players: S.players.map(n => ({ name: n.trim() || 'Jugador', cards: [], score: 0, played: 0 })), current: null, pick: null, guess: null, res: null };
  q.forEach(id => G.byId[id] = byId[id]);
  if (G.mode === 'timeline') G.players.forEach(p => { const id = G.queue.shift(); p.cards = [G.byId[id]]; seen.add(id); });
  nextSong(); view = 'game'; lsSet('hp_seen', [...seen]);
}
function nextSong() {
  if (!G.queue.length) return endGame();
  const id = G.queue.shift(); G.current = G.byId[id]; G.phase = 'play'; G.pick = null; G.res = null;
  G.guess = Math.round((G.from + G.to) / 2);
  seen.add(id); lsSet('hp_seen', [...seen]); saveG();
  loadAudio(G.current);
  const nx = G.queue[0]; if (nx) lookup(G.byId[nx]); // precarga del siguiente
}
function confirm_() {
  const p = G.players[G.turn], s = G.current; aud.pause();
  if (G.mode === 'timeline') {
    const c = p.cards, i = G.pick;
    const ok = (i === 0 || c[i - 1].year <= s.year) && (i === c.length || s.year <= c[i].year);
    if (ok) c.splice(i, 0, s);
    G.res = { ok, text: ok ? '¡Acertó! La carta se queda.' : 'Fallo. La carta se descarta.' };
  } else {
    const d = Math.abs(G.guess - s.year), pts = d === 0 ? 3 : d <= 2 ? 2 : d <= 5 ? 1 : 0;
    G.res = { ok: pts > 0, pts, d, bonus: false, text: d === 0 ? '¡Año exacto! +3' : pts ? `A ${d} año${d > 1 ? 's' : ''}: +${pts}` : `Se pasó por ${d} años: +0` };
    p.score += pts;
  }
  p.played++; G.phase = 'reveal'; saveG();
}
function advance() {
  const p = G.players[G.turn];
  if (G.mode === 'timeline' && p.cards.length >= G.target) return endGame();
  if (G.mode === 'year' && G.players.every(x => x.played >= G.rounds)) return endGame();
  do { G.turn = (G.turn + 1) % G.players.length; } while (G.mode === 'year' && G.players[G.turn].played >= G.rounds);
  nextSong();
}
function endGame() { G.over = true; G.phase = 'end'; aud.pause(); saveG(); view = 'end'; }
const ranking = () => G.players.map(p => ({ ...p, pts: G.mode === 'timeline' ? p.cards.length : p.score })).sort((a, b) => b.pts - a.pts);

/* ---------- vistas ---------- */
const chip = (act, val, label, on) => `<button class="chip" data-act="${act}" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
function setupView() {
  const n = pool().length, ok = n >= needed();
  return `
  <h1>Hit<span>party</span></h1>
  <p class="sub">Escucha, adivina el año y arma tu línea de tiempo.</p>

  <h2>Jugadores</h2>
  <div class="card">
    ${S.players.map((p, i) => `<div class="row" style="margin-bottom:8px">
      <input type="text" class="grow" data-pn="${i}" value="${esc(p)}" maxlength="20" aria-label="Nombre del jugador ${i + 1}">
      <button class="ghost" data-act="delp" data-v="${i}" aria-label="Quitar jugador" ${S.players.length < 2 ? 'disabled' : ''}>✕</button></div>`).join('')}
    <button class="ghost" data-act="addp" ${S.players.length >= 8 ? 'disabled' : ''}>+ Agregar jugador</button>
  </div>

  <h2>Modo de juego</h2>
  <div class="seg">
    <button data-act="mode" data-v="timeline" aria-pressed="${S.mode === 'timeline'}">Línea de tiempo<small>Coloca cada canción en su orden. Gana quien llena su línea.</small></button>
    <button data-act="mode" data-v="year" aria-pressed="${S.mode === 'year'}">Adivina el año<small>Escribe el año. Puntos por cercanía.</small></button>
  </div>
  <div class="row" style="margin-top:10px"><label class="field grow">${S.mode === 'timeline' ? 'Cartas para ganar' : 'Rondas por jugador'}
    <input type="number" inputmode="numeric" data-num="${S.mode === 'timeline' ? 'target' : 'rounds'}" min="3" max="30" value="${S.mode === 'timeline' ? S.target : S.rounds}"></label></div>

  <h2>Rango de años</h2>
  <div class="row"><label class="field grow">Desde<input type="number" inputmode="numeric" data-num="from" min="1940" max="2025" value="${S.from}"></label>
    <label class="field grow">Hasta<input type="number" inputmode="numeric" data-num="to" min="1940" max="2025" value="${S.to}"></label></div>
  <div class="chips" style="margin-top:10px">
    ${DECADES.map(d => chip('decade', d, `${String(d).slice(2)}s`, S.from === d && S.to === d + 9)).join('')}
    ${chip('decade', 'all', 'Todos', S.from === 1940 && S.to === 2025)}
  </div>

  <h2>Idioma <small style="text-transform:none;letter-spacing:0">(vacío = todos)</small></h2>
  <div class="chips">${Object.entries(LANGS).map(([k, v]) => chip('lang', k, v, S.langs.includes(k))).join('')}</div>

  <h2>Género <small style="text-transform:none;letter-spacing:0">(vacío = todos)</small></h2>
  <div class="chips">${Object.entries(GENRES).map(([k, v]) => chip('genre', k, v, S.genres.includes(k))).join('')}</div>

  <h2>Otros</h2>
  <label class="check"><input type="checkbox" data-chk="noRepeat" ${S.noRepeat ? 'checked' : ''}> No repetir canciones de partidas anteriores (${seen.size} jugadas)</label>
  <label class="check"><input type="checkbox" data-chk="useCustom" ${S.useCustom ? 'checked' : ''}> Incluir mis canciones (${custom.length})</label>
  ${seen.size ? '<button class="ghost" data-act="resetseen">Olvidar canciones jugadas</button>' : ''}

  <details style="margin-top:14px"><summary>Mis canciones</summary><div>
    <div class="row wrap">
      <input type="text" id="c_t" class="grow" placeholder="Título" style="flex-basis:100%">
      <input type="text" id="c_a" class="grow" placeholder="Artista" style="flex-basis:100%">
      <input type="number" id="c_y" inputmode="numeric" placeholder="Año" min="1900" max="2030" class="grow">
      <select id="c_l" class="grow" aria-label="Idioma">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <select id="c_g" class="grow" aria-label="Género" style="flex-basis:100%">${Object.entries(GENRES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <button class="ghost grow" data-act="addc" style="flex-basis:100%">Agregar canción</button>
    </div>
    <ul class="mini">${custom.map((c, i) => `<li><span>${esc(c.title)} · ${esc(c.artist)} (${c.year})</span><button class="ghost" data-act="delc" data-v="${i}" aria-label="Quitar">✕</button></li>`).join('')}</ul>
  </div></details>

  <p class="count"><b>${n}</b> canciones con estos filtros${ok ? '' : ` · necesitas al menos ${needed()}`}</p>
  <button class="primary" data-act="start" ${ok ? '' : 'disabled'}>Empezar partida</button>
  <footer>Audio: vista previa de 30 s de Apple Music (iTunes). Necesita internet. Todo se guarda solo en tu teléfono.</footer>`;
}

function scoreBar() {
  return `<div class="score">${G.players.map((p, i) => `<span class="pill ${i === G.turn ? 'on' : ''}">${esc(p.name)} · ${G.mode === 'timeline' ? p.cards.length + '/' + G.target : p.score + ' pts'}</span>`).join('')}</div>`;
}
function songCard(s, extra = '') { return `<div class="song ${extra}"><span class="y">${s.year}</span><span><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></span></div>`; }

function gameView() {
  const p = G.players[G.turn], s = G.current;
  const top = `<div class="top"><strong>Hitparty</strong><button class="ghost" data-act="quit">Terminar</button></div>${scoreBar()}`;
  const turn = `<div class="turn"><small>Turno de</small><h2>${esc(p.name)}</h2></div>`;
  if (G.phase === 'reveal') {
    const art = audioState.art ? `<img src="${esc(audioState.art)}" alt="" onerror="this.remove()">` : '';
    const last = !G.queue.length;
    return top + `<div class="reveal">${art}<div class="y">${s.year}</div><h3>${esc(s.title)}</h3><p class="sub">${esc(s.artist)} · ${esc(LANGS[s.lang] || '')} · ${esc(GENRES[s.genre] || '')}</p>
      <div class="res ${G.res.ok ? 'ok' : 'no'}">${esc(G.res.text)}</div>
      ${G.mode === 'year' ? `<label class="check" style="justify-content:center"><input type="checkbox" data-chk="bonus" ${G.res.bonus ? 'checked' : ''}> Acertó título y artista (+1)</label>` : `<div class="tl">${p.cards.map(c => songCard(c, c === s ? 'new' : '')).join('')}</div>`}
      <button class="primary" data-act="next">${esc('Siguiente')}</button></div>`;
  }
  let body;
  if (G.mode === 'timeline') {
    const c = p.cards, slots = [];
    for (let i = 0; i <= c.length; i++) {
      slots.push(`<button class="slot" data-act="pick" data-v="${i}" aria-pressed="${G.pick === i}">${G.pick === i ? '✔ Aquí' : (i === 0 ? '↑ Más antigua que esta' : i === c.length ? '↓ Más reciente que esta' : 'Entre estas dos')}</button>`);
      if (i < c.length) slots.push(songCard(c[i]));
    }
    body = `<div class="tl">${slots.join('')}</div><button class="primary stick" data-act="confirm" ${G.pick == null ? 'disabled' : ''}>Confirmar posición</button>`;
  } else {
    body = `<div class="yr"><div class="big"><button data-act="y-" aria-label="Año anterior">−</button><input type="number" inputmode="numeric" id="gy" value="${G.guess}" aria-label="Año elegido"><button data-act="y+" aria-label="Año siguiente">+</button></div>
      <input type="range" id="gr" min="${G.from}" max="${G.to}" value="${Math.min(Math.max(G.guess, G.from), G.to)}" aria-label="Deslizar año"></div>
      <button class="primary" data-act="confirm">Confirmar año ${G.guess}</button>`;
  }
  return top + turn + `<div class="player"><div class="q">?</div>
      <button class="playbtn" id="play" data-act="play" disabled>…</button>
      <div class="bar"><i id="bar"></i></div><div class="note" id="anote"></div>
      <button class="ghost" id="skip" data-act="skipsong" style="color:#fff;margin-top:8px" hidden>Saltar esta canción</button></div>` + body;
}

function endView() {
  const r = ranking(), win = r[0];
  return `<h1>🏆 ${esc(win.name)}</h1><p class="sub">${G.mode === 'timeline' ? 'Llenó su línea de tiempo primero.' : 'Se llevó la mayor puntuación.'}</p>
    <ol class="rank">${r.map((p, i) => `<li><span class="n">${i + 1}</span>${esc(p.name)}<span class="p">${p.pts} ${G.mode === 'timeline' ? 'cartas' : 'pts'}</span></li>`).join('')}</ol>
    <button class="primary" data-act="again">Revancha</button>
    <button class="ghost" style="width:100%;margin-top:10px" data-act="home">Cambiar ajustes</button>`;
}

function render() {
  const app = $('#app');
  const keep = document.activeElement && document.activeElement.id;
  app.innerHTML = view === 'setup' ? setupView() : view === 'game' ? gameView() : endView();
  if (view === 'game' && G.phase === 'play') paintAudio();
  if (keep) { const e = document.getElementById(keep); if (e && e.tagName === 'INPUT') e.focus(); }
}

/* ---------- eventos ---------- */
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (a === 'play') { aud.paused ? aud.play().catch(() => {}) : aud.pause(); return; }
  if (a === 'addp') S.players.push('Jugador ' + (S.players.length + 1));
  else if (a === 'delp') S.players.splice(+v, 1);
  else if (a === 'mode') S.mode = v;
  else if (a === 'decade') { if (v === 'all') { S.from = 1940; S.to = 2025; } else { S.from = +v; S.to = Math.min(+v + 9, 2025); } }
  else if (a === 'lang') S.langs = toggle(S.langs, v);
  else if (a === 'genre') S.genres = toggle(S.genres, v);
  else if (a === 'resetseen') { seen = new Set(); lsSet('hp_seen', []); }
  else if (a === 'addc') {
    const title = $('#c_t').value.trim(), artist = $('#c_a').value.trim(), year = +$('#c_y').value;
    if (!title || !artist || year < 1900 || year > 2030) { alert('Completa título, artista y un año válido.'); return; }
    custom.push({ id: title + '|' + artist, title, artist, year, lang: $('#c_l').value, genre: $('#c_g').value, custom: true }); lsSet('hp_custom', custom);
  }
  else if (a === 'delc') { custom.splice(+v, 1); lsSet('hp_custom', custom); }
  else if (a === 'start') { saveS(); startGame(); }
  else if (a === 'pick') { G.pick = +v; saveG(); }
  else if (a === 'y-' || a === 'y+') { G.guess = Math.min(2030, Math.max(1900, G.guess + (a === 'y+' ? 1 : -1))); saveG(); }
  else if (a === 'confirm') { if (G.mode === 'timeline' ? G.pick == null : !G.guess) return; confirm_(); }
  else if (a === 'next') advance();
  else if (a === 'skipsong') { nextSongKeepTurn(); }
  else if (a === 'quit') { if (confirm('¿Terminar la partida ahora?')) endGame(); }
  else if (a === 'again') { startGame(); }
  else if (a === 'home') { G = null; lsSet('hp_game', null); view = 'setup'; }
  saveS(); render();
});
function nextSongKeepTurn() { if (!G.queue.length) return endGame(); nextSong(); }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pn != null) { S.players[+t.dataset.pn] = t.value; saveS(); }
  else if (t.id === 'gr') { G.guess = +t.value; saveG(); $('#gy').value = G.guess; document.querySelector('[data-act=confirm]').textContent = 'Confirmar año ' + G.guess; }
  else if (t.id === 'gy') { const n = +t.value; if (n >= 1900 && n <= 2030) { G.guess = n; saveG(); document.querySelector('[data-act=confirm]').textContent = 'Confirmar año ' + n; const r = $('#gr'); if (r) r.value = n; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.num) { let n = Math.round(+t.value); const k = t.dataset.num;
    if (k === 'from' || k === 'to') n = Math.min(2025, Math.max(1940, n || DEFAULTS[k])); else n = Math.min(30, Math.max(3, n || DEFAULTS[k]));
    S[k] = n; if (S.from > S.to) { k === 'from' ? S.to = S.from : S.from = S.to; } saveS(); render(); }
  else if (t.dataset.chk === 'bonus') {
    const p = G.players[G.turn]; G.res.bonus = t.checked; p.score += t.checked ? 1 : -1; saveG(); }
  else if (t.dataset.chk) { S[t.dataset.chk] = t.checked; saveS(); render(); }
});

render();
if (view === 'game' && G.current && G.phase === 'play') loadAudio(G.current);
if (view === 'game' && G.phase === 'reveal') lookup(G.current).then(p => { if (p) { audioState.art = p.art; render(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
