<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creando Recuerdos</title>
<meta name="description" content="Cuenta el tiempo que queda y llénalo de recuerdos con la gente que quieres. Vive solo en tu teléfono y usa tus propias IAs.">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Recuerdos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..800&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#141C33; --muted:#56617A; --faint:#8A93A8; --line:#D6DCE7;
  --accent:#F0A202; --accent-ink:#8A5300; --accent-soft:#FCEFD0;
  --lived:#C3CAD8; --left:#22305A;
  --good:#1E7656; --good-soft:#DCF0E6; --warn:#B0432A; --warn-soft:#F7E0D8;
  --c1:#F0A202; --c2:#22305A; --c3:#1E7656; --c4:#8D6FC0;
  --scrim:rgba(10,14,28,.45);
  --f-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --gut:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1120; --surface:#131A2D; --surface-2:#19213A; --ink:#E8ECF5; --muted:#A3ACC2; --faint:#6F7994; --line:#29334C;
    --accent:#FFB22E; --accent-ink:#FFC65C; --accent-soft:#35280F;
    --lived:#2A3352; --left:#C9D2E6;
    --good:#5CC49B; --good-soft:#123326; --warn:#F08A6C; --warn-soft:#3B1D15;
    --c1:#FFB22E; --c2:#9FB4E8; --c3:#5CC49B; --c4:#B89BE6;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1120; --surface:#131A2D; --surface-2:#19213A; --ink:#E8ECF5; --muted:#A3ACC2; --faint:#6F7994; --line:#29334C;
  --accent:#FFB22E; --accent-ink:#FFC65C; --accent-soft:#35280F;
  --lived:#2A3352; --left:#C9D2E6;
  --good:#5CC49B; --good-soft:#123326; --warn:#F08A6C; --warn-soft:#3B1D15;
  --c1:#FFB22E; --c2:#9FB4E8; --c3:#5CC49B; --c4:#B89BE6;
  --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;padding-inline:var(--gut);padding-block:4px 56px}
@media (min-width:720px){:root{--gut:28px}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:28px;line-height:1;font-variation-settings:"opsz" 48;letter-spacing:-.01em}
.brand .bulb{margin-top:6px}
.hello{font-size:15px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px 10px;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
@media (min-width:720px){.tabs{gap:8px}.tabs button{flex:0 0 auto;padding-inline:14px;font-size:16px}}

/* buttons, pills, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.ai{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.btn.ai:hover{border-color:var(--accent)}
.btn.small{min-height:34px;padding:5px 12px;font-size:14px}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.danger[data-armed]{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.btn.quiet{border-color:transparent;background:transparent;padding-inline:8px}
.btn.quiet:hover{background:var(--surface-2)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:6px;min-width:0}
.field label,.flabel{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.check{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.chip input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
fieldset.care{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0}
.bgrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (min-width:560px){.bgrid{grid-template-columns:1.6fr .8fr 1.2fr .8fr}}
.bgrid .field:first-child{grid-column:1 / -1}
@media (min-width:560px){.bgrid .field:first-child{grid-column:auto}}
fieldset.care legend{padding-inline:6px}
.care-note{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.idea .adapt{font-size:14px;color:var(--muted)}
.f2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:560px){.f2{grid-template-columns:1fr 1fr}.f2 .full{grid-column:1 / -1}}

/* layout blocks */
.view{display:grid;gap:22px;padding-block:22px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel > h2,.sec-h{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;font-variation-settings:"opsz" 36}
.panel-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.lede{color:var(--muted);max-width:62ch;margin-top:4px}
.two{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:880px){.two{grid-template-columns:1fr 1fr}}

/* banner */
.banner{margin-top:14px;padding:16px 18px;border-radius:14px;background:var(--accent-soft);color:var(--ink);display:grid;gap:12px}
.banner p{max-width:70ch}
.banner form{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.banner form .field{flex:1 1 180px}
.banner form .field.narrow{flex:0 1 130px}
.banner .field input{background:var(--surface)}

/* hero */
.hero{display:grid;gap:18px;padding-block:14px 4px}
.count{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:18px;font-weight:400}
.count .lead{flex-basis:100%;font-size:22px;color:var(--muted);margin-bottom:6px}
.count .num{font-family:var(--f-body);font-weight:800;font-size:clamp(96px,19vw,200px);line-height:1;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.count .unit{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(34px,6vw,62px);line-height:1.1;font-variation-settings:"opsz" 72}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hero .sub{font-size:19px;max-width:56ch}
.garland{display:flex;flex-wrap:wrap;gap:12px 8px;max-width:820px;padding-top:6px}
.bulb{display:inline-block;flex:none;width:11px;height:15px;border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;background:var(--lived);position:relative}
.bulb::before{content:"";position:absolute;left:3px;top:-4px;width:5px;height:4px;border-radius:1px;background:var(--faint)}
.bulb.on{background:var(--accent);box-shadow:0 0 9px -1px var(--accent)}
.bulb.next{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px 3px var(--accent);transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){.bulb.next{animation:none;outline:2px solid var(--accent);outline-offset:3px}}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.weeks{display:flex;flex-wrap:wrap;gap:5px;max-width:820px}
.weeks i{width:14px;height:14px;border-radius:3px;background:var(--lived);display:block}
.weeks i.free{background:transparent;border:1.5px solid var(--left)}
.weeks i.plan{background:var(--accent)}
.weeks i.long{background:var(--good)}
.weeks i.bridge{background:var(--c4)}
@media (min-width:720px){.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat.st-long{border-top-color:var(--good)}
.stat.st-bridge{border-top-color:var(--c4)}
.hdlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.hdlist li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.hdform{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.hdform .field{flex:1 1 160px}
details.manual{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.manual summary{cursor:pointer;font-weight:600}

.opps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;max-width:900px}
.opp{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;line-height:1.3}
.opp:hover{border-color:var(--accent)}
.opp b{font-size:15px}
.opp span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border-top:2px solid var(--ink);padding-top:8px}
.stat b{display:block;font-family:var(--f-body);font-weight:800;font-size:34px;line-height:1.15;font-variant-numeric:lining-nums tabular-nums}

.gridwrap{margin-top:14px;overflow-x:auto}
#lifegrid{display:block;cursor:crosshair;max-width:none}
.cap{margin-top:8px;font-size:14px;color:var(--muted);min-height:1.5em}

/* tail end list */
.tails{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
.tail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.tail .tn strong{font-weight:700}
.tail .tn span{color:var(--muted);font-size:14px;margin-left:6px}
.tail .tv{text-align:right;font-variant-numeric:tabular-nums}
.tail .tv b{font-size:24px;font-weight:800}
.tail .tv span{display:block;font-size:12px;color:var(--muted);font-family:var(--f-mono);line-height:1}
.track{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.note{font-size:14px;color:var(--muted);margin-top:14px}

/* plans */
.plans{display:grid}
.plan{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 14px;padding-block:14px;border-top:1px solid var(--line)}
.plan:first-child{border-top:0}
.when{text-align:center;line-height:1.1;padding-top:2px}
.when .d{display:block;font-weight:800;font-size:30px;font-variant-numeric:lining-nums}
.when .m{display:block;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.when .w{display:block;font-size:12px;color:var(--muted)}
.when.none .d{font-size:22px;color:var(--faint)}
.plan h3{font-size:18px;font-weight:700;line-height:1.3}
.plan .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted);margin-top:4px}
.plan .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.memory{margin:8px 0 0;padding-left:12px;border-left:2px solid var(--accent);font-style:italic;color:var(--ink);max-width:62ch}
.acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini .plan{grid-template-columns:52px minmax(0,1fr);padding-block:10px}
.mini .when .d{font-size:26px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sec{display:grid;gap:4px}
.sec + .sec{margin-top:10px}
.sec-h{display:flex;align-items:baseline;gap:10px}
.sec-h .n{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-weight:400}
.empty{padding:18px 0;color:var(--muted)}

/* people */
.people{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.person{display:grid;gap:10px;align-content:start}
.person h3{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;font-variation-settings:"opsz" 48}
.person .rel{font-size:14px;color:var(--muted)}
.enc{display:flex;align-items:baseline;gap:10px}
.enc b{font-weight:800;font-size:60px;line-height:1;font-variant-numeric:lining-nums;letter-spacing:-.02em}
.enc span{font-size:17px;color:var(--muted)}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}

/* goals */
.yearbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.goals{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.goal{display:grid;gap:10px;align-content:start}
.goal h3{font-size:18px;font-weight:700}
.goal .hint{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.stepper output{min-width:2.4ch;text-align:center;font-weight:800;font-size:28px;font-variant-numeric:lining-nums tabular-nums}
.gbar{height:10px;border-radius:5px;background:var(--surface-2);display:flex;overflow:hidden}
.gbar .done{background:var(--good)}
.gbar .sched{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,var(--accent-soft) 4px 8px)}
.gbar .over{background:var(--faint)}
.gtext{font-size:14px;color:var(--muted)}
.cadence{font-size:19px;max-width:60ch;margin-top:6px}
.sugg{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.sugg li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.sugg .sd{display:grid;line-height:1.25}
.sugg .sd b{font-size:15px}
.sugg .sd span{font-size:13px;color:var(--muted)}
.longs{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.long{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.long.past{opacity:.55}
.long .lr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.long .lr b{font-size:17px}
.long .hn{font-size:15px}
.long .bridge{font-size:15px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--c4) 14%,var(--surface))}
.pill.purple{background:color-mix(in srgb,var(--c4) 16%,var(--surface));color:var(--c4)}
.gitems{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.gitems li{display:flex;align-items:center;gap:10px}
.gitems li.done span{text-decoration:line-through;color:var(--muted)}
.gitems li span{flex:1;min-width:0}
.gform{display:flex;gap:8px;margin-top:12px}

/* trips */
.trip{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:920px){.trip{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}}
.tform{display:grid;gap:14px}
.tform .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.itin{display:grid;gap:16px}
.itin h2{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.1;font-variation-settings:"opsz" 72}
.itin .why{color:var(--muted);max-width:62ch}
.bstack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.bstack i{display:block;height:100%}
.blegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;font-size:14px;margin-top:10px}
.blegend div{display:flex;align-items:center;gap:8px}
.blegend b{margin-left:auto;font-variant-numeric:tabular-nums}
.day{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.day h3{font-size:19px;font-weight:700}
.day h3 .label{margin-right:8px}
.slots{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot{font-size:15px}
.slot .label{display:block;margin-bottom:2px}
.moment{display:flex;gap:10px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.moment b{color:var(--accent-ink);flex:none}
.tips{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.thinking{display:flex;align-items:center;gap:14px;padding:24px 0}
.thinking .bulb{animation:glow 1.4s ease-in-out infinite;background:var(--accent)}
.err{padding:14px 16px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}

/* ideas */
.ideas{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));margin-top:12px}
.idea{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.idea h3{font-size:17px;font-weight:700;line-height:1.3}
.idea p{font-size:15px}
.idea .rec{color:var(--accent-ink)}
.idea .meta{font-size:13px;color:var(--muted)}

/* fotos */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.ph{position:relative;flex:none}
.thumb{width:76px;height:76px;object-fit:cover;border-radius:8px;display:block;background:var(--surface-2);cursor:zoom-in;border:1px solid var(--line)}
.ph .x{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;line-height:1;cursor:pointer}
.ph .x[data-armed]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.addph{position:relative;width:76px;height:76px;border:1.5px dashed var(--faint);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.2;color:var(--muted);cursor:pointer;padding:4px}
.addph:hover{border-color:var(--accent);color:var(--ink)}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.addph:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.big{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:10px}
/* itinerario: opciones, agregados y ajuste con IA */
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));margin-top:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.opt h4{margin:0;font-size:16px}
.opt .meta{font-size:13px;color:var(--muted)}
.opt p{font-size:14px}
.opt .add{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opt .add select{width:auto;padding:5px 8px;font-size:14px}
.extras{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.extras li{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:15px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.refine{border:1px solid var(--accent);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--accent-soft)}
.refine .chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer}
.accepted-note{padding:10px 12px;border-radius:10px;background:var(--good-soft);font-size:15px}
.newslist{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:end center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{place-items:center}}
.m-box{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:580px;max-height:100%;overflow:auto;padding:20px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.m-head h2{font-family:var(--f-display);font-weight:600;font-size:26px;font-variation-settings:"opsz" 36}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.m-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.m-actions .sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:min(92vw,520px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:grid;gap:4px}
/* versión local: mis IAs, pedido a tu IA, respaldo */
.top{flex-wrap:wrap}
.top .row{gap:8px}
@media (max-width:479px){.hello{display:none}}
.modes{display:grid;gap:8px;border:0;padding:0;margin:0}
.modes legend{padding:0;margin-bottom:6px}
.mode{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.mode input{width:20px;height:20px;margin-top:3px;accent-color:var(--ink);flex:none}
.mode:has(input:checked){border-color:var(--ink);background:var(--surface-2)}
.mode.off{opacity:.6;cursor:default}
.mode .hint{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.keybox{display:grid;gap:14px;padding:14px;border-radius:12px;background:var(--surface-2)}
.keybox a{color:var(--accent-ink);font-weight:600;text-underline-offset:3px}
.steps{margin:0;padding-left:22px;display:grid;gap:16px}
.steps li::marker{font-weight:800}
.steps .hint{font-size:14px;color:var(--muted);margin-top:6px}
.backup{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.backup .hint{font-size:14px;color:var(--muted)}
.filebtn input{display:none}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="bulb on" aria-hidden="true"></span>Creando Recuerdos</div>
    <div class="row"><span class="hello" id="hello"></span><button class="btn small ai" data-action="ias">✦ Mis IAs</button><button class="btn small" data-action="profile">Tus datos</button></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" data-tab="tiempo" aria-selected="true">Tiempo</button>
    <button role="tab" data-tab="personas" aria-selected="false">Personas</button>
    <button role="tab" data-tab="agenda" aria-selected="false">Agenda</button>
    <button role="tab" data-tab="viajes" aria-selected="false">Viajes</button>
    <button role="tab" data-tab="metas" aria-selected="false">Metas</button>
  </nav>
  <div id="banner"></div>
  <main id="view" class="view"></main>

</div>
<div id="modal" class="modal" hidden><div class="m-box" id="m-box" role="dialog" aria-modal="true" aria-labelledby="m-title"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
const clone = o => JSON.parse(JSON.stringify(o));
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if (!s || typeof s !== 'string') return null; const [y,m,d] = s.split('-').map(Number); if (!y || !m || !d) return null; return new Date(y, m-1, d); };
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const nf = new Intl.NumberFormat('es');
const fmtN = n => nf.format(Math.round(n));
const fmt1 = n => n.toLocaleString('es', {maximumFractionDigits: 1});
const fmtDate = (d, o = {weekday:'short', day:'numeric', month:'short'}) => new Intl.DateTimeFormat('es', o).format(d);
const newId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const listJoin = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1];
const str = v => typeof v === 'string' ? v.trim().slice(0, 1200) : (v == null ? '' : String(v).slice(0, 1200));
const num = v => { const n = Number(v); return isFinite(n) && n >= 0 ? n : 0; };
function money(n, c) { try { return new Intl.NumberFormat('es', {style:'currency', currency: c || 'USD', maximumFractionDigits: 0}).format(n || 0); } catch { return fmtN(n || 0) + ' ' + (c || ''); } }
const cur = () => (state.profile.currency || 'USD').toUpperCase();

const TYPE_KEYS = ['salida','viaje','celebracion','unoauno','tradicion'];
const TYPES = {
  salida: {label:'Mini salida', plural:'Mini salidas', hint:'Unas horas fuera de la rutina'},
  viaje: {label:'Viaje', plural:'Viajes', hint:'Una o más noches fuera de casa'},
  celebracion: {label:'Celebración', plural:'Celebraciones', hint:'Cumpleaños, aniversarios, logros'},
  unoauno: {label:'Uno a uno', plural:'Tiempo uno a uno', hint:'A solas con una sola persona'},
  tradicion: {label:'Tradición', plural:'Tradiciones', hint:'Algo que se repite y se espera'}
};
const DEFAULT_GOALS = {salida:12, viaje:2, celebracion:4, unoauno:6, tradicion:4};
const DEFAULT_E = 95;
const CONDITIONS = [
  ['demencia', 'Alzheimer o demencia'],
  ['silla', 'Usa silla de ruedas'],
  ['oxigeno', 'Depende de oxígeno'],
  ['movilidad', 'Camina con dificultad o bastón'],
  ['cansancio', 'Se cansa rápido'],
  ['corazon', 'Problemas del corazón'],
  ['diabetes', 'Diabetes'],
  ['dialisis', 'Recibe diálisis'],
  ['vision', 'Baja visión'],
  ['audicion', 'Baja audición'],
  ['avion', 'No puede viajar en avión'],
  ['cuidador', 'Necesita acompañante o cuidador']
];
const CONDITION_LABEL = Object.fromEntries(CONDITIONS);
const conditionList = x => (x.conditions || []).map(k => CONDITION_LABEL[k]).filter(Boolean).concat(x.health ? [x.health] : []);
const personExp = x => clamp(Math.round(num(x.expectancy)) || DEFAULT_E, 40, 120);
/* país, moneda y hemisferio */
const COUNTRIES = [
  ['AR','Argentina','ARS','sur'], ['BO','Bolivia','BOB','sur'], ['CL','Chile','CLP','sur'], ['CO','Colombia','COP','norte'],
  ['CR','Costa Rica','CRC','norte'], ['CU','Cuba','CUP','norte'], ['EC','Ecuador','USD','sur'], ['SV','El Salvador','USD','norte'],
  ['ES','España','EUR','norte'], ['US','Estados Unidos','USD','norte'], ['GT','Guatemala','GTQ','norte'], ['HN','Honduras','HNL','norte'],
  ['MX','México','MXN','norte'], ['NI','Nicaragua','NIO','norte'], ['PA','Panamá','USD','norte'], ['PY','Paraguay','PYG','sur'],
  ['PE','Perú','PEN','sur'], ['PR','Puerto Rico','USD','norte'], ['DO','República Dominicana','DOP','norte'], ['UY','Uruguay','UYU','sur'],
  ['VE','Venezuela','VES','norte'], ['XX','Otro país','USD','norte']
];
const COUNTRY = Object.fromEntries(COUNTRIES.map(c => [c[0], { name: c[1], currency: c[2], hemi: c[3] }]));
const countryName = p => p.country === 'XX' ? (p.countryName || '') : (COUNTRY[p.country] ? COUNTRY[p.country].name : '');
const countryOptions = sel => `<option value="">Elige tu país</option>` + COUNTRIES.map(([k, n]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${n}</option>`).join('');

/* feriados nacionales calculados con las reglas oficiales */
function easter(Y) {
  const a = Y % 19, b = Math.floor(Y / 100), c = Y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(Y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
const fx = (Y, m, d) => new Date(Y, m, d);
const nthDow = (Y, m, dow, n) => { const f = new Date(Y, m, 1); return addDays(f, (dow - f.getDay() + 7) % 7 + (n - 1) * 7); };
const lastDow = (Y, m, dow) => { const l = new Date(Y, m + 1, 0); return addDays(l, -((l.getDay() - dow + 7) % 7)); };
const toMonday = d => addDays(d, (1 - d.getDay() + 7) % 7);
const argMove = d => { const w = d.getDay(); return w === 2 || w === 3 ? addDays(d, 1 - w) : w === 4 || w === 5 ? addDays(d, 8 - w) : d; };
const usObs = d => d.getDay() === 6 ? addDays(d, -1) : d.getDay() === 0 ? addDays(d, 1) : d;
const HOLIDAY_RULES = {
  MX: Y => { const E = easter(Y); return [
    [fx(Y,0,1),'Año Nuevo'], [nthDow(Y,1,1,1),'Día de la Constitución'], [nthDow(Y,2,1,3),'Natalicio de Benito Juárez'],
    [addDays(E,-3),'Jueves Santo',1], [addDays(E,-2),'Viernes Santo',1], [fx(Y,4,1),'Día del Trabajo'], [fx(Y,8,16),'Día de la Independencia'],
    ...((Y - 2024) % 6 === 0 ? [[fx(Y,9,1),'Transmisión del Poder Ejecutivo']] : []),
    [fx(Y,10,2),'Día de Muertos',1], [nthDow(Y,10,1,3),'Revolución Mexicana'], [fx(Y,11,12),'Día de la Virgen de Guadalupe',1], [fx(Y,11,25),'Navidad']]; },
  CO: Y => { const E = easter(Y); return [
    [fx(Y,0,1),'Año Nuevo'], [toMonday(fx(Y,0,6)),'Reyes Magos'], [toMonday(fx(Y,2,19)),'San José'], [addDays(E,-3),'Jueves Santo'], [addDays(E,-2),'Viernes Santo'],
    [fx(Y,4,1),'Día del Trabajo'], [addDays(E,43),'Ascensión del Señor'], [addDays(E,64),'Corpus Christi'], [addDays(E,71),'Sagrado Corazón'],
    [toMonday(fx(Y,5,29)),'San Pedro y San Pablo'], [fx(Y,6,20),'Día de la Independencia'], [fx(Y,7,7),'Batalla de Boyacá'], [toMonday(fx(Y,7,15)),'Asunción de la Virgen'],
    [toMonday(fx(Y,9,12)),'Día de la Raza'], [toMonday(fx(Y,10,1)),'Todos los Santos'], [toMonday(fx(Y,10,11)),'Independencia de Cartagena'],
    [fx(Y,11,8),'Inmaculada Concepción'], [fx(Y,11,25),'Navidad']]; },
  PE: Y => { const E = easter(Y); return [
    [fx(Y,0,1),'Año Nuevo'], [addDays(E,-3),'Jueves Santo'], [addDays(E,-2),'Viernes Santo'], [fx(Y,4,1),'Día del Trabajo'], [fx(Y,5,7),'Batalla de Arica y Día de la Bandera'],
    [fx(Y,5,29),'San Pedro y San Pablo'], [fx(Y,6,23),'Día de la Fuerza Aérea'], [fx(Y,6,28),'Fiestas Patrias'], [fx(Y,6,29),'Fiestas Patrias'], [fx(Y,7,6),'Batalla de Junín'],
    [fx(Y,7,30),'Santa Rosa de Lima'], [fx(Y,9,8),'Combate de Angamos'], [fx(Y,10,1),'Todos los Santos'], [fx(Y,11,8),'Inmaculada Concepción'], [fx(Y,11,9),'Batalla de Ayacucho'], [fx(Y,11,25),'Navidad']]; },
  AR: Y => { const E = easter(Y); return [
    [fx(Y,0,1),'Año Nuevo'], [addDays(E,-48),'Carnaval'], [addDays(E,-47),'Carnaval'], [fx(Y,2,24),'Día de la Memoria'], [fx(Y,3,2),'Día de los Veteranos de Malvinas'],
    [addDays(E,-3),'Jueves Santo',1], [addDays(E,-2),'Viernes Santo'], [fx(Y,4,1),'Día del Trabajo'], [fx(Y,4,25),'Revolución de Mayo'], [argMove(fx(Y,5,17)),'Paso a la Inmortalidad de Güemes'],
    [fx(Y,5,20),'Día de la Bandera'], [fx(Y,6,9),'Día de la Independencia'], [argMove(fx(Y,7,17)),'Paso a la Inmortalidad de San Martín'], [argMove(fx(Y,9,12)),'Día del Respeto a la Diversidad Cultural'],
    [argMove(fx(Y,10,20)),'Día de la Soberanía Nacional'], [fx(Y,11,8),'Inmaculada Concepción'], [fx(Y,11,25),'Navidad']]; },
  ES: Y => { const E = easter(Y); return [
    [fx(Y,0,1),'Año Nuevo'], [fx(Y,0,6),'Reyes'], [addDays(E,-3),'Jueves Santo',1], [addDays(E,-2),'Viernes Santo'], [fx(Y,4,1),'Día del Trabajo'], [fx(Y,7,15),'Asunción'],
    [fx(Y,9,12),'Fiesta Nacional'], [fx(Y,10,1),'Todos los Santos'], [fx(Y,11,6),'Día de la Constitución'], [fx(Y,11,8),'Inmaculada Concepción'], [fx(Y,11,25),'Navidad']]; },
  US: Y => [
    [usObs(fx(Y,0,1)),'Año Nuevo'], [nthDow(Y,0,1,3),'Martin Luther King Jr.'], [nthDow(Y,1,1,3),'Día de los Presidentes'], [lastDow(Y,4,1),'Memorial Day'],
    [usObs(fx(Y,5,19)),'Juneteenth'], [usObs(fx(Y,6,4)),'Día de la Independencia'], [nthDow(Y,8,1,1),'Labor Day'], [nthDow(Y,9,1,2),'Columbus Day',1],
    [usObs(fx(Y,10,11)),'Día de los Veteranos'], [nthDow(Y,10,4,4),'Acción de Gracias'], [usObs(fx(Y,11,25)),'Navidad']],
  CL: Y => { const E = easter(Y); const out = [
    [fx(Y,0,1),'Año Nuevo'], [addDays(E,-2),'Viernes Santo'], [addDays(E,-1),'Sábado Santo'], [fx(Y,4,1),'Día del Trabajo'], [fx(Y,4,21),'Día de las Glorias Navales'],
    ...(Y >= 2021 ? [[juneSolsticeCL(Y),'Día de los Pueblos Indígenas']] : []), [chMove(fx(Y,5,29)),'San Pedro y San Pablo'], [fx(Y,6,16),'Virgen del Carmen'],
    [fx(Y,7,15),'Asunción de la Virgen'], [fx(Y,8,18),'Independencia Nacional'], [fx(Y,8,19),'Glorias del Ejército'], [chMove(fx(Y,9,12)),'Encuentro de Dos Mundos'],
    [chEvang(Y),'Día de las Iglesias Evangélicas'], [fx(Y,10,1),'Todos los Santos'], [fx(Y,11,8),'Inmaculada Concepción'], [fx(Y,11,25),'Navidad']];
    if (fx(Y,8,17).getDay() === 1) out.push([fx(Y,8,17),'Fiestas Patrias']);
    if (fx(Y,8,20).getDay() === 5) out.push([fx(Y,8,20),'Fiestas Patrias']);
    return out; }
};
/* Chile, Ley 19.668: si cae martes, miércoles o jueves pasa al lunes de esa semana; si cae viernes, al lunes siguiente */
function chMove(d) { const w = d.getDay(); return w >= 2 && w <= 4 ? addDays(d, 1 - w) : w === 5 ? addDays(d, 3) : d; }
/* Chile, Ley 20.299: si el 31 de octubre cae martes pasa al viernes anterior; si cae miércoles, al viernes siguiente */
function chEvang(Y) { const d = fx(Y, 9, 31), w = d.getDay(); return w === 2 ? fx(Y, 9, 27) : w === 3 ? fx(Y, 10, 2) : d; }
/* Chile, Ley 21.357: el día del solsticio de invierno (hora de Chile, UTC-4). Fórmula de Meeus. */
function juneSolsticeCL(Y) {
  const y = (Y - 2000) / 1000;
  const jde = 2451716.56767 + 365241.62603 * y + 0.00325 * y * y + 0.00888 * y ** 3 - 0.00030 * y ** 4;
  const t = new Date((jde - 2440587.5) * DAY - 4 * 3600000);
  return new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate());
}
const holKey = (p, Y) => ((p.country === 'XX' ? (p.countryName || 'otro') : p.country) + '-' + Y).normalize('NFD').replace(/[^A-Za-z0-9-]/g, '');
function holidaysFor(Y) {
  const p = state.profile;
  if (!p.country) return { list: [], source: null };
  const key = holKey(p, Y), stored = (p.holidays || {})[key], rule = HOLIDAY_RULES[p.country];
  const custom = (p.customHolidays || []).map(h => h.yearly ? { date: `${Y}-${String(h.date).slice(5)}`, name: h.name, custom: true } : String(h.date).startsWith(Y + '-') ? { date: h.date, name: h.name, custom: true } : null).filter(h => h && parseD(h.date));
  let base = [], source = null;
  if (stored && stored.length) { base = stored; source = 'ia'; }
  else if (rule) { base = rule(Y).map(([d, name, opt]) => ({ date: fmtISO(d), name, optional: !!opt })); source = 'reglas'; }
  const seen = new Set(), list = base.concat(custom).filter(h => { const k = h.date + '|' + h.name; if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => a.date.localeCompare(b.date));
  return { list, source: source || (custom.length ? 'manual' : null), key, customCount: custom.length };
}
function longWeekends(Y) {
  const hols = holidaysFor(Y).list.concat(holidaysFor(Y + 1).list.filter(h => h.date < `${Y + 1}-01-15`));
  const names = new Map(); hols.forEach(h => names.set(h.date, (names.get(h.date) ? names.get(h.date) + ' · ' : '') + h.name + (h.optional ? ' (no en todos los trabajos)' : '')));
  const off = d => d.getDay() === 0 || d.getDay() === 6 || names.has(fmtISO(d));
  const block = d => { let a = d, b = d; while (off(addDays(a, -1))) a = addDays(a, -1); while (off(addDays(b, 1))) b = addDays(b, 1); return [a, b]; };
  const t = today0(), seen = new Set(), out = [];
  for (const h of hols) {
    const d = parseD(h.date);
    if (!d || d.getFullYear() !== Y || d.getDay() === 0 || d.getDay() === 6) continue;
    const [a, b] = block(d), k = fmtISO(a);
    if (seen.has(k)) continue; seen.add(k);
    const len = daysBetween(a, b) + 1;
    let bridge = null;
    for (const dir of [-1, 1]) {
      const take = []; let x = dir < 0 ? addDays(a, -1) : addDays(b, 1);
      while (take.length < 2 && !off(x)) { take.push(x); x = addDays(x, dir); }

function holidayCounts(L) {
  const p = state.profile;
  if (!p.country || (p.country === 'XX' && !p.countryName)) return null;
  const Y0 = L.t.getFullYear(), Y1 = L.end.getFullYear();
  let longs = 0, bridges = 0, missing = 0, known = 0;
  const rateL = [], rateB = [];
  for (let Y = Y0; Y <= Y1; Y++) {
    if (!holidaysFor(Y).list.length) { missing++; continue; }
    known++;
    const all = longWeekends(Y), ops = all.filter(o => !o.past && o.start <= L.end);
    longs += ops.filter(o => o.len >= 3).length;
    bridges += ops.filter(o => o.len < 3 && o.bridge).length;
    rateL.push(all.filter(o => o.len >= 3).length); rateB.push(all.filter(o => o.len < 3 && o.bridge).length);
  }
  if (!known) return { noData: true };
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  if (missing) { longs += Math.round(avg(rateL) * missing); bridges += Math.round(avg(rateB) * missing); }
  return { longs, bridges, approx: missing > 0 };
}

function yearStats(Y) {

  for (const k of TYPE_KEYS) {

  const st = yearStats(Y);

  const rem = {}; TYPE_KEYS.forEach(k => rem[k] = st[k].missing);
  const total = TYPE_KEYS.reduce((a, k) => a + rem[k], 0);
  const r = {...rem}, order = [];

function connectDb(db, uid) {

  const pref = db.doc(`data/users/${uid}/profile`);

  const readyTimer = setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 12000);

    if (snap.metadata.fromCache && !snap.exists) return;
    if (!S.ready) { S.ready = true; clearTimeout(readyTimer); }

  S.peopleCol.onSnapshot(snap => { DBD.people = snap.docs.map(d => ({...clone(d.data()), id: d.id})); apply(); }, dbFail);
  S.plansCol.onSnapshot(snap => { DBD.plans = snap.docs.map(d => ({...clone(d.data()), id: d.id})); apply(); }, dbFail);

        ${plan ? `<p class="small"><span class="pill good">Ya tienes plan</span> ${esc(plan.title)}</p>` : `<div class="row"><button class="btn small primary" data-action="long-plan" data-y="${Y}" data-i="${i}">Planear escapada</button>${AI.off ? '' : `<button class="btn small ai" data-action="long-trip" data-y="${Y}" data-i="${i}">✦ Itinerario</button>`}</div>`}
      </li>`;
    }).join('');
    const nLong = up.filter(o => o.len >= 3).length, nBridge = up.filter(o => o.len < 3 && o.bridge).length;
    body = `<p class="lede">${Y === t.getFullYear() ? 'Te quedan' : 'Hay'} <strong>${nLong}</strong> ${nLong === 1 ? 'fin de semana largo' : 'fines de semana largos'} y <strong>${nBridge}</strong> ${nBridge === 1 ? 'puente posible' : 'puentes posibles'} en ${Y}. Un feriado en martes o jueves, más un día libre que pidas, te da cuatro días seguidos.</p>

function holPrompt(cname, Y) {
  return `Lista los feriados nacionales oficiales de ${cname} para el año ${Y}.
- Da la fecha en que realmente se descansa: si la ley traslada un feriado (por ejemplo a lunes), usa la fecha trasladada.
- Incluye los días puente o no laborables decretados oficialmente para ${Y} si los conoces, con "opcional": true.
- Marca también con "opcional": true los días que no son obligatorios para todos los trabajadores (por ejemplo, Jueves Santo en algunos países).
- No incluyas feriados regionales ni municipales.
Responde solo con un arreglo JSON, sin texto adicional, así:
[{"fecha":"${Y}-01-01","nombre":"Año Nuevo","opcional":false}]`;
}
async function runHolidays(Y) {
  const sample = await getSample();
  if (!sample) { toast('Traer los feriados con IA funciona cuando abres esta app dentro de Claude.'); return; }
  if (AI.hol.status === 'running') return;
  const p = state.profile, cname = countryName(p); if (!cname) return;
  const key = holKey(p, Y), ctl = new AbortController();
  AI.hol = { status:'running', started: Date.now(), ctl, Y };
  renderView(); tick();
  try {
    const r = await sample.json(holPrompt(cname, Y), { signal: ctl.signal, cache: false });
    const arr = Array.isArray(r) ? r : (r && Array.isArray(r.feriados) ? r.feriados : []);
    const seen = new Set();
    const list = arr.filter(o => o && /^\d{4}-\d{2}-\d{2}$/.test(String(o.fecha)) && parseD(o.fecha) && parseD(o.fecha).getFullYear() === Y)
      .map(o => ({ date: o.fecha, name: str(o.nombre).slice(0, 80) || 'Feriado', optional: !!o.opcional }))
      .filter(o => { const k = o.date + o.name; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 40);
    if (!list.length) throw { code: 'invalid_json' };
    state.profile.holidays = Object.assign({}, state.profile.holidays, { [key]: list });
    AI.hol = { status:'idle' };
    saveProfile();
    if (!state.example) toast(`Feriados de ${cname} ${Y} actualizados.`);
  } catch (e) {
    AI.hol = (e && e.code === 'cancelled') ? { status:'idle' } : { status:'error', msg: aiErr(e), Y };
    renderView();
  }
}

/* Lee la sección de cumpleaños: fecha completa, o cumpleaños + edad, o solo uno de los dos */
function readBirth(f) {
  const bd = $('#pe-bdate', f).value, day = Number($('#pe-bday', f).value), mv = $('#pe-bmonth', f).value, av = $('#pe-age', f).value;
  const m = mv === '' ? null : Number(mv), t = today0();
  if (parseD(bd)) { const d = parseD(bd); return { birthDate: bd, birthday: bd.slice(5), birthYear: d.getFullYear() }; }
  if ((day && m == null) || (!day && m != null)) return { error: 'Para el cumpleaños elige el día y el mes.' };
  if (day && m != null) {
    if (new Date(2024, m, day).getMonth() !== m) return { error: 'Ese día no existe en ese mes.' };
    const md = `${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    let birthYear = null;
    if (av !== '') { const a = clamp(Math.round(num(av)), 0, 120), had = new Date(t.getFullYear(), m, day) <= t; birthYear = t.getFullYear() - a - (had ? 0 : 1); }
    return { birthDate: '', birthday: md, birthYear };
  }
  if (av !== '') return { birthDate: '', birthday: '', birthYear: t.getFullYear() - clamp(Math.round(num(av)), 0, 120) };
  return { birthDate: '', birthday: '', birthYear: null };
}
function birthHint(f) {
  const r = readBirth(f), el = $('#pe-bhint', f);
  if (r.error || (!r.birthday && !r.birthYear)) { el.textContent = ''; return; }
  const tmp = { birthDate: r.birthDate, birthday: r.birthday, birthYear: r.birthYear }, nb = nextBirthday(tmp), age = ageOf(tmp);
  if (nb) {
    const n = daysBetween(today0(), nb.date);
    el.textContent = `${nb.turns != null ? `Cumple ${nb.turns}` : 'Su cumpleaños es'} el ${fmtDate(nb.date, { weekday:'long', day:'numeric', month:'long' })}, ${n === 0 ? 'hoy' : n === 1 ? 'mañana' : `en ${n} días`}. Aparecerá en tu agenda.`;
  } else el.textContent = age != null ? `Tiene unos ${age} años. Agrega el día y el mes para ver su cumpleaños en la agenda.` : '';
}

/* Dentro de Claude se guardan como archivos de la app (assets) y el plan guarda solo su id.
   Abierta como archivo, se guardan en IndexedDB de este navegador. En el ejemplo, solo en memoria. */
const MAX_PHOTOS = 3;
const photoURLs = new Map();
let assetsP = null;
const getAssets = () => assetsP || (assetsP = use('assets'));
/* Versión 2 de la base local: `fotos` (igual que antes) y `ajustes` (clave de cifrado y claves de IA cifradas). */
let idbP = null;
function idbOpen() {
  return idbP || (idbP = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('creando-recuerdos', 2);
      r.onupgradeneeded = () => { for (const s of ['fotos', 'ajustes']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
      r.onsuccess = () => res(r.result); r.onerror = () => { idbP = null; rej(r.error); };
    } catch (e) { idbP = null; rej(e); }
  }));
}
async function idbStore(store, mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => { const tx = db.transaction(store, mode), req = fn(tx.objectStore(store)); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); });
}
const idbDo = (mode, fn) => idbStore('fotos', mode, fn);
async function shrinkImage(file, max = 1600, q = 0.82) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = () => rej({ code: 'decode' }); im.src = u; }); }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  if (!blob) throw { code: 'decode' };
  return blob;
}
async function storePhoto(blob) {
  if (state.example) { const id = 'mem-' + newId(); photoURLs.set(id, URL.createObjectURL(blob)); return { id, mem: true }; }
  if (S.mode === 'db') {
    const a = await getAssets(); if (!a) throw { code: 'not_granted' };
    try { return { id: (await a.upload(blob, { type: 'image/jpeg' })).id }; }
    catch (e) { if (e && e.code === 'store_unavailable') { await new Promise(r => setTimeout(r, 800)); return { id: (await a.upload(blob, { type: 'image/jpeg' })).id }; } throw e; }
  }
  const id = 'local-' + newId();
  await idbDo('readwrite', st => st.put(blob, id));
  photoURLs.set(id, URL.createObjectURL(blob));
  return { id, local: true };
}
async function dropPhoto(ph) {
  try {
    if (ph.mem) { const u = photoURLs.get(ph.id); if (u) URL.revokeObjectURL(u); photoURLs.delete(ph.id); }
    else if (ph.local) { await idbDo('readwrite', st => st.delete(ph.id)); photoURLs.delete(ph.id); }
    else if (!state.example) { const a = await getAssets(); if (a) await a.delete(ph.id); }
  } catch {}
}
function photoErr(e) {
  switch (e && e.code) {
    case 'decode': return 'No pude leer esa foto. Prueba con una JPG o PNG.';
    case 'too_large': return 'La foto es demasiado grande.';
    case 'quota_or_state': return 'Se llenó el espacio de fotos de la app. Borra fotos que ya no uses.';
    case 'rate_limited': return 'Demasiadas fotos seguidas. Espera un momento y vuelve a intentar.';
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return 'En esta vista no se pueden guardar fotos.';
    case 'upstream_auth': return 'Tu sesión expiró. Recarga la página y vuelve a intentar.';
    default: return 'No se pudo guardar la foto. Revisa tu conexión y vuelve a intentar.';
  }
}
/* Sube hasta `room` fotos de un <input type=file> y devuelve las guardadas */
async function addPhotos(files, room) {
  const list = [...(files || [])].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic)$/i.test(f.name)).slice(0, Math.max(0, room));
  if (!list.length) { if (room <= 0) toast(`Máximo ${MAX_PHOTOS} fotos.`); return []; }
  if ((files || []).length > room) toast(`Solo caben ${room} ${room === 1 ? 'foto más' : 'fotos más'}; agregué las primeras.`);
  else toast(list.length === 1 ? 'Guardando la foto…' : `Guardando ${list.length} fotos…`);
  const out = [];
  for (const f of list) {
    try { out.push(await storePhoto(await shrinkImage(f))); }
    catch (e) { toast(photoErr(e)); break; }
  }
  return out;
}
function photoImg(ph) {
  if (ph.mem || ph.local) { const u = photoURLs.get(ph.id); return `<img class="thumb" alt="Foto" ${u ? `src="${u}"` : `data-lp="${esc(ph.id)}"`}>`; }
  return `<img class="thumb" alt="Foto" loading="lazy" src="/_blob/${esc(ph.id)}">`;
}
/* where: "plan:<id>" o "day:<id>:<índice>" o "form" */
function photosHTML(photos, where, canAdd) {
  const ph = photos || [];
  if (!ph.length && !canAdd) return '';
  return `<div class="thumbs">${ph.map(p => `<div class="ph">${photoImg(p)}<button type="button" class="x" data-action="photo-del" data-where="${esc(where)}" data-ph="${esc(p.id)}" aria-label="Borrar foto">×</button></div>`).join('')}
    ${canAdd && ph.length < MAX_PHOTOS ? `<label class="addph">+ Foto<br>${ph.length}/${MAX_PHOTOS}<input type="file" accept="image/*" multiple data-photo="${esc(where)}" aria-label="Agregar fotos"></label>` : ''}</div>`;
}
async function hydrateLocalPhotos(root = document) {
  for (const img of root.querySelectorAll('img[data-lp]')) {
    const id = img.dataset.lp; img.removeAttribute('data-lp');
    if (photoURLs.has(id)) { img.src = photoURLs.get(id); continue; }
    try { const blob = await idbDo('readonly', st => st.get(id)); if (blob) { const u = URL.createObjectURL(blob); photoURLs.set(id, u); img.src = u; } } catch {}

}

/* La clave de IA no se guarda en texto plano: se cifra con una llave AES que el navegador genera como
   no exportable (esta página puede usarla, pero no leerla ni sacarla del dispositivo). */
let cipherP = null;
function cipherKey() {
  return cipherP || (cipherP = (async () => {
    let k = await idbStore('ajustes', 'readonly', st => st.get('llave'));
    if (!k) {
      k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      await idbStore('ajustes', 'readwrite', st => st.put(k, 'llave'));
    }
    return k;
  })().catch(e => { cipherP = null; throw e; }));
}
async function storeApiKey(ai, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await cipherKey(), new TextEncoder().encode(key));
  await idbStore('ajustes', 'readwrite', st => st.put({ iv, data }, 'clave-' + ai));
}
async function readApiKey(ai) {
  const rec = await idbStore('ajustes', 'readonly', st => st.get('clave-' + ai));
  if (!rec) return '';
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv }, await cipherKey(), rec.data));
}
const dropApiKey = ai => idbStore('ajustes', 'readwrite', st => st.delete('clave-' + ai));

/* Llamadas directas a cada IA con la clave del usuario */
const anthropicHeaders = key => ({ 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' });
async function apiJSON(r) {
  let j = null; try { j = await r.json(); } catch {}
  if (r.ok && j) return j;
  const msg = JSON.stringify((j && j.error) || j || '').toLowerCase(), s = r.status;
  const code = s === 401 || s === 403 || (s === 400 && /api[ _-]?key/.test(msg)) ? 'bad_key'
    : s === 402 || /credit|quota|billing|balance/.test(msg) ? 'no_credit'
    : s === 404 ? 'model_gone' : s === 413 ? 'prompt_too_large' : s === 429 ? 'rate_limited' : s >= 500 ? 'overloaded' : 'network';
  throw { code, status: s };
}
const verOf = id => Number((String(id).match(/(\d+(?:\.\d+)?)/) || [0, 0])[1]);
/* Elige el modelo más nuevo que la clave puede usar; así la app no queda atada a nombres que cambian */
async function pickModel(ai, key, quality, signal) {
  const q = quality === 'economica' ? 'economica' : 'mejor';
  if (ai === 'gemini') {
    const j = await apiJSON(await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { signal, headers: { 'x-goog-api-key': key } }));
    const ids = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name).replace(/^models\//, ''));
    if (ids.includes(MODEL_FALLBACK.gemini[q])) return MODEL_FALLBACK.gemini[q];
    const re = q === 'mejor' ? /^gemini-\d+(\.\d+)?-flash$/ : /^gemini-\d+(\.\d+)?-flash-lite$/;
    return ids.filter(i => re.test(i)).sort((a, b) => verOf(b) - verOf(a))[0] || MODEL_FALLBACK.gemini[q];
  }
  if (ai === 'claude') {
    const j = await apiJSON(await fetch('https://api.anthropic.com/v1/models?limit=100', { signal, headers: anthropicHeaders(key) }));
    const fam = q === 'mejor' ? 'sonnet' : 'haiku';
    return (j.data || []).map(m => m.id).find(i => i.includes(fam)) || MODEL_FALLBACK.claude[q];   // la lista viene de más nuevo a más viejo
  }
  const j = await apiJSON(await fetch('https://api.openai.com/v1/models', { signal, headers: { authorization: 'Bearer ' + key } }));
  const re = q === 'mejor' ? /^gpt-\d+(\.\d+)?$/ : /^gpt-\d+(\.\d+)?-mini$/;
  return (j.data || []).map(m => m.id).filter(i => re.test(i)).sort((a, b) => verOf(b) - verOf(a))[0] || MODEL_FALLBACK.openai[q];
}
/* `max` solo se usa para la prueba corta al guardar la clave */
async function callKey(ai, model, key, msgs, signal, max) {
  const post = (url, headers, body) => fetch(url, { method: 'POST', signal, headers: Object.assign({ 'content-type': 'application/json' }, headers), body: JSON.stringify(body) }).then(apiJSON);
  if (ai === 'gemini') {
    const j = await post(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { 'x-goog-api-key': key },
      { contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { responseMimeType: 'application/json', maxOutputTokens: max || 16384 } });
    const c = j.candidates && j.candidates[0];
    if (!c) throw { code: j.promptFeedback ? 'refused' : 'empty_completion' };
    if (c.finishReason === 'MAX_TOKENS') throw { code: 'invalid_json' };
    if (c.finishReason === 'SAFETY') throw { code: 'refused' };
    return ((c.content && c.content.parts) || []).map(p => p.text || '').join('');
  }
  if (ai === 'claude') {
    const j = await post('https://api.anthropic.com/v1/messages', anthropicHeaders(key), { model, max_tokens: max || 12000, messages: msgs });
    if (j.stop_reason === 'refusal') throw { code: 'refused' };
    if (j.stop_reason === 'max_tokens') throw { code: 'invalid_json' };
    return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  }
  const j = await post('https://api.openai.com/v1/chat/completions', { authorization: 'Bearer ' + key }, Object.assign({ model, messages: msgs }, max ? { max_completion_tokens: max } : {}));
  const c = j.choices && j.choices[0];
  if (!c) throw { code: 'empty_completion' };
  if (c.message && c.message.refusal) throw { code: 'refused' };
  if (c.finish_reason === 'length') throw { code: 'invalid_json' };
  return (c.message && c.message.content) || '';
}
/* Saca el JSON de una respuesta, venga sola, dentro de un bloque ```json o con texto alrededor */
function pullJSON(text) {
  const t = String(text || '').replace(/^﻿/, '').trim(), tries = [t];
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence) tries.push(fence[1].trim());
  const a = t.search(/[[{]/);
  if (a >= 0) { const b = t.lastIndexOf(t[a] === '[' ? ']' : '}'); if (b > a) tries.push(t.slice(a, b + 1)); }
  for (const s of tries) { try { return JSON.parse(s); } catch {} }
  throw { code: 'invalid_json' };
}
/* Reemplaza a sample.json de la versión tienda: mismo contrato (texto o conversación → JSON) */
async function aiJSON(input, opts = {}) {
  const msgs = typeof input === 'string' ? [{ role: 'user', content: input }] : input;
  const ai = IAS.keyAI;
  if (IAS.mode === 'key' && IAS.keys[ai]) {
    const key = await readApiKey(ai).catch(() => '');
    if (key) {
      try {
        let model = IAS.models[ai] || MODEL_FALLBACK[ai][IAS.quality] || MODEL_FALLBACK[ai].mejor;
        try { return pullJSON(await callKey(ai, model, key, msgs, opts.signal)); }
        catch (e) {
          if (!(e && e.code === 'model_gone')) throw e;
          IAS.models[ai] = model = await pickModel(ai, key, IAS.quality, opts.signal); saveIAS();   // el modelo guardado ya no existe
          return pullJSON(await callKey(ai, model, key, msgs, opts.signal));

      } catch (e) {
        if (e && e.name === 'AbortError') throw { code: 'cancelled' };
        throw (e && e.code) ? e : { code: 'network' };

        <li><strong>Copia la respuesta</strong><p class="hint">Cuando tu IA termine, toca Copiar en el bloque de código de su respuesta.</p></li>
        <li><strong>Vuelve aquí y pégala</strong>

    <div class="m-actions"><span class="sp"></span><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn primary">Recuperar</button></div>`, async () => {
    closeModal();
    for (const [id, url] of Object.entries(d.fotos || {})) {
      try { const blob = await (await fetch(url)).blob(); await idbDo('readwrite', st => st.put(blob, id)); photoURLs.delete(id); } catch {}
    }
    state = { example: false, profile: Object.assign(blankProfile(), d.datos.profile), people: d.datos.people || [], plans: d.datos.plans || [] };
    if (d.ias) {
      const x = d.ias, keyAI = KEY_AI[x.keyAI] ? x.keyAI : 'gemini';
      Object.assign(IAS, { has: x.has || {}, app: AIS[x.app] ? x.app : '', keyAI, quality: x.quality === 'economica' ? 'economica' : 'mejor', mode: x.mode === 'key' && IAS.keys[keyAI] ? 'key' : 'app' });
      saveIAS();
    }
    saveLocal(); render();
    toast(d.ias && d.ias.mode === 'key' && IAS.mode !== 'key' ? 'Copia recuperada. Vuelve a pegar tu clave de IA en Mis IAs.' : 'Copia recuperada. Todo quedó en este teléfono.');
  }, () => {});
}

/* Instalar como app (Chrome en Android y computador) */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (state) renderChrome(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (state) renderChrome(); toast('App instalada. Ábrela desde tu pantalla de inicio.'); });

/* ---------- eventos ---------- */
function goTab(tab) { ui.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch {} render(); window.scrollTo({ top: 0 }); }
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) goTab(b.dataset.tab); });

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { goTab(go.dataset.go); return; }
  const th = e.target.closest('img.thumb'); if (th && !modal.contains(th) && th.src) { openLightbox(th.src); return; }
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  const L = () => life(state.profile);
  switch (a) {
    case 'close-modal': closeModal(); break;
    case 'profile': profileForm(); break;
    case 'ias': iasForm(); break;
    case 'ia-key-del': {
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '¿Seguro? Toca otra vez'; break; }
      const ai = b.dataset.ai;
      dropApiKey(ai).catch(() => {}); delete IAS.keys[ai]; delete IAS.models[ai];
      if (IAS.keyAI === ai) IAS.mode = 'app';
      saveIAS(); closeModal(); render(); toast('Clave borrada de este teléfono.');
      break;
    }
    case 'relay-open': {
      const k = b.dataset.ai, app = AIS[k]; if (!RELAY || !app) break;
      IAS.app = k; saveIAS();
      const url = app.url(RELAY.prompt);
      copyQuiet(RELAY.prompt).then(() => window.open(url, '_blank', 'noopener'));
      break;
    }
    case 'relay-share': if (RELAY) navigator.share({ text: RELAY.prompt }).catch(() => {}); break;
    case 'relay-copy': if (RELAY) copyQuiet(RELAY.prompt).then(ok => ok ? toast('Pedido copiado. Pégalo en tu IA.') : showPrompt()); break;
    case 'relay-paste': {
      const ta = $('#rl-text'), manual = () => { toast('Mantén presionado el cuadro y elige Pegar.'); if (ta) ta.focus(); };
      if (!navigator.clipboard || !navigator.clipboard.readText) { manual(); break; }
      navigator.clipboard.readText().then(t => { if (ta) ta.value = t; relayTry(t); }).catch(manual);
      break;
    }
    case 'backup-save': backupSave(false); break;
    case 'backup-share': backupSave(true); break;
    case 'install': if (installEvt) { const ev = installEvt; ev.prompt(); ev.userChoice.finally(() => { installEvt = null; renderChrome(); }); } break;
    case 'unit': ui.unit = b.dataset.unit; try { localStorage.setItem('lqq-unit', ui.unit); } catch {} renderView(); break;
    case 'hero-cta': {
      const l = L(), c = unitCount(ui.unit, l, state.profile), all = state.people.map(x => x.id);
      if (ui.unit === 'navidad') planForm({ title:`Navidad ${c.next.getFullYear()}`, type:'celebracion', date:`${c.next.getFullYear()}-12-24`, endDate:`${c.next.getFullYear()}-12-25`, people: all }, true);
      else if (ui.unit === 'cumple') planForm({ title:`Mis ${l.age + 1} años`, type:'celebracion', date: fmtISO(c.next), people: all }, true);
      else if (ui.unit === 'anio') planForm({ title:`Fin de año ${c.next.getFullYear() - 1}`, type:'celebracion', date: fmtISO(addDays(c.next, -1)), people: all }, true);
      else if (ui.unit === 'verano') { ui.tripForm = ui.tripForm || defaultTripForm(); ui.tripForm.date = fmtISO(addDays(c.next, -14)); ui.tripForm.days = 5; goTab('viajes'); }
      break;
    }
    case 'new-plan': planForm({ type:'salida', people: [], budget: state.profile.budgetOuting || '' }, true); break;
    case 'new-invite': planForm({ type:'celebracion', people: [], invited: true, rsvp: 'pendiente' }, true); break;
    case 'rsvp': {
      const p = state.plans.find(x => x.id === id); if (!p) break;
      const out = Object.assign(clone(p), { rsvp: b.dataset.v });
      savePlan(out);
      if (!state.example) toast(b.dataset.v === 'si' ? `Confirmado: vas a "${p.title}". Quedó como plan fijo.` : `Listo: no vas a "${p.title}".`);
      break;
    }
    case 'bday-plan': {
      const x = personById(id), nb = x && nextBirthday(x); if (!nb) break;
      planForm({ title: `Cumpleaños de ${x.name}${nb.turns != null ? ` (${nb.turns})` : ''}`, type:'celebracion', date: fmtISO(nb.date), people: [x.id], budget: state.profile.budgetOuting || '' }, true);
      break;
    }
    case 'edit-plan': { const p = state.plans.find(x => x.id === id); if (p) planForm(clone(p), false); break; }
    case 'memory': { const p = state.plans.find(x => x.id === id); if (p) planForm(clone(p), false, { memory: true }); break; }
    case 'invite': { const p = state.plans.find(x => x.id === id); if (p) copyText(inviteText(p)); break; }
    case 'afilter': ui.agendaFilter = b.dataset.f; renderView(); break;
    case 'afilter-go': ui.agendaFilter = b.dataset.f; goTab('agenda'); break;
    case 'new-person': personForm({ visits: 12, near:'lejos' }, true); break;
    case 'edit-person': { const x = personById(id); if (x) personForm(clone(x), false); break; }
    case 'plan-with': planForm({ type:'unoauno', people:[id], budget: state.profile.budgetOuting || '' }, true); break;
    case 'ideas': runIdeas(null, false); break;
    case 'ideas-for': runIdeas(id, false); break;
    case 'ideas-more': runIdeas(AI.ideas.focusId, true); break;
    case 'ideas-retry': runIdeas(AI.ideas.focusId, true); break;
    case 'ideas-close': AI.ideas = { status:'idle' }; renderView(); break;
    case 'stop-ideas': AI.ideas.ctl && AI.ideas.ctl.abort(); break;
    case 'idea-plan': case 'idea-save': {
      const i = Number(b.dataset.i), o = AI.ideas.list && AI.ideas.list[i]; if (!o) break;
      const plan = { title: o.titulo, type: o.tipo, people: o.con, budget: o.costo, date:'', notes: [o.descripcion, o.recuerdo ? 'Para recordar: ' + o.recuerdo : '', o.adaptacion ? 'Adaptación: ' + o.adaptacion : ''].filter(Boolean).join('\n') };
      const mark = () => { if (AI.ideas.added && !AI.ideas.added.includes(i)) AI.ideas.added.push(i); renderView(); };
      if (a === 'idea-save') { savePlan(Object.assign(plan, { id: newId(), done:false, createdAt: Date.now() })); mark(); if (!state.example) toast('Idea guardada en la agenda.'); }
      else planForm(plan, true, { onSaved: mark });
      break;
    }
    case 'open-trip': {
      const p = state.plans.find(x => x.id === id); if (!p) break;
      if (p.itinerary) { ui.tripView = p.id; goTab('viajes'); }
      else {
        const f = defaultTripForm();
        ui.tripForm = Object.assign(f, { dest: p.place || '', date: p.date || f.date, days: p.endDate && p.date ? clamp(daysBetween(parseD(p.date), parseD(p.endDate)) + 1, 1, 14) : f.days, people: (p.people || []).slice(), budget: p.budget || '' });
        ui.tripLinkId = p.id; goTab('viajes');
      }
      break;
    }
    case 'run-trip': runTrip(true); break;
    case 'trip-again': ui.tripForm = Object.assign(ui.tripForm || defaultTripForm(), clone((currentItin() || {}).itin?.req || {})); runTrip(true); break;
    case 'stop-trip': AI.trip.ctl && AI.trip.ctl.abort(); break;
    case 'save-trip': {
      const it = AI.trip.result; if (!it) break;
      const plan = planFromDraft(it, false);
      AI.trip.savedId = plan.id; ui.tripView = plan.id; ui.tripLinkId = null;
      savePlan(plan); if (!state.example) toast('Guardado como borrador en tu agenda. Puedes seguir ajustándolo.');
      break;
    }
    case 'accept-itin': {
      const key = b.dataset.t;
      if (key === 'draft') {
        const it = AI.trip.result; if (!it) break;
        const plan = planFromDraft(it, true);
        AI.trip.savedId = plan.id; ui.tripView = plan.id; ui.tripLinkId = null;
        savePlan(plan);
      } else applyItin(key, it => Object.assign(it, { accepted: true, acceptedAt: Date.now() }));
      if (!state.example) toast('Itinerario aceptado y en tu agenda. Ahora puedes agregar fotos a cada día.');
      break;
    }
    case 'reopen-itin': applyItin(b.dataset.t, it => Object.assign(it, { accepted: false })); break;
    case 'refine': {
      const text = (($('#rf-text') || {}).value || '').trim();
      if (!text) { toast('Escribe qué quieres cambiar o agregar.'); const t = $('#rf-text'); if (t) t.focus(); break; }
      ui.refineText = text; runRefine(b.dataset.t, text);
      break;
    }
    case 'rf-chip': {
      const cur0 = (ui.refineText || '').trim();
      ui.refineText = (cur0 ? cur0 + (/[.,;]$/.test(cur0) ? ' ' : '. ') : '') + b.dataset.v;
      renderView();
      const t = $('#rf-text'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
      break;
    }
    case 'stop-refine': AI.refine.ctl && AI.refine.ctl.abort(); break;
    case 'opt-add': {
      const kind = b.dataset.kind, i = Number(b.dataset.i), sel = $(`#opt-day-${kind}-${i}`), di = sel ? Number(sel.value) : 0;
      let name = '';
      applyItin(b.dataset.t, it => {
        const o = ((it.opciones || {})[kind] || [])[i], d = (it.dias || [])[di];
        if (o && d) { name = o.nombre; d.extras = (d.extras || []).concat({ titulo: o.nombre, detalle: [o.tipo, o.zona || o.cuando, o.precio].filter(Boolean).join(' · '), kind }); }
        return it;
      });
      if (name) toast(`${name} quedó en el día ${di + 1}.`);
      break;
    }
    case 'extra-del': applyItin(b.dataset.t, it => { const d = (it.dias || [])[Number(b.dataset.d)]; if (d && d.extras) d.extras.splice(Number(b.dataset.x), 1); return it; }); break;
    case 'photo-del': {
      if (b.dataset.where === 'form') break;
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '¿Borrar?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; } }, 3000); break; }
      const [kind, pid, di] = b.dataset.where.split(':'), phId = b.dataset.ph;
      const p = state.plans.find(x => x.id === pid); if (!p) break;
      const out = clone(p); let ph = null;
      if (kind === 'plan') { ph = (out.photos || []).find(x => x.id === phId); out.photos = (out.photos || []).filter(x => x.id !== phId); }
      else { const d = out.itinerary && out.itinerary.dias[Number(di)]; if (d) { ph = (d.photos || []).find(x => x.id === phId); d.photos = (d.photos || []).filter(x => x.id !== phId); } }
      savePlan(out); if (ph) dropPhoto(ph);
      if (!state.example) toast('Foto borrada.');
      break;
    }
    case 'news': showNews(); break;
    case 'goal': {
      const Y = ui.goalYear, k = b.dataset.k;
      const g = Object.assign({}, goalsFor(Y)); g[k] = clamp((g[k] || 0) + Number(b.dataset.d), 0, 99);
      state.profile.goals = Object.assign({}, state.profile.goals, { [Y]: g });
      saveProfile(); break;
    }
    case 'gyear': ui.goalYear = Number(b.dataset.y); renderView(); break;
    case 'hol-ai': runHolidays(Number(b.dataset.y)); break;
    case 'hol-manual': {
      ui.hdOpen = true; goTab('metas');
      const sec = $('#feriados'); if (sec) { sec.scrollIntoView({ block: 'start' }); const d = $('#hd-date'); if (d) d.focus({ preventScroll: true }); }
      break;
    }
    case 'hd-del': {
      state.profile.customHolidays = (state.profile.customHolidays || []).filter(c => c.id !== id);
      saveProfile(); break;
    }
    case 'stop-hol': AI.hol.ctl && AI.hol.ctl.abort(); break;
    case 'long-plan': case 'long-trip': {
      const o = longWeekends(Number(b.dataset.y))[Number(b.dataset.i)]; if (!o) break;
      const r = o.bridge || o, days = daysBetween(r.start, r.end) + 1;
      const label = o.names.length ? o.names[0].replace(/ \(.*\)$/, '') : 'fin de semana largo';
      if (a === 'long-plan') planForm({ title: `Escapada del ${label}`, type: days >= 3 ? 'viaje' : 'salida', date: fmtISO(r.start), endDate: fmtISO(r.end), people: [], budget: '', notes: o.bridge ? `Pedir libre: ${o.bridge.take.map(d => fmtDate(d, { weekday:'long', day:'numeric', month:'long' })).join(' y ')}.` : '' }, true);
      else { ui.tripForm = Object.assign(ui.tripForm || defaultTripForm(), { date: fmtISO(r.start), days: clamp(days, 1, 14) }); ui.tripLinkId = null; goTab('viajes'); toast(`Fechas listas: ${days} días desde el ${fmtDate(r.start, { weekday:'long', day:'numeric', month:'long' })}.`); }
      break;
    }
    case 'sugg': {
      const x = suggestions(ui.goalYear).picks[Number(b.dataset.i)]; if (!x) break;
      planForm({ type: x.type, date: fmtISO(x.date), endDate: x.type === 'viaje' ? fmtISO(addDays(x.date, 1)) : '', people: [], budget: state.profile.budgetOuting || '' }, true);
      break;
    }
    case 'sugg-all': {
      const picks = suggestions(ui.goalYear).picks;
      (async () => { for (const x of picks) await savePlan({ id: newId(), title: `${TYPES[x.type].label} (por definir)`, type: x.type, date: fmtISO(x.date), endDate: x.type === 'viaje' ? fmtISO(addDays(x.date, 1)) : '', people: [], budget: 0, done:false, createdAt: Date.now() }); if (!state.example) toast(`${picks.length} fechas apartadas en tu agenda.`); })();
      break;
    }
    case 'gi-del': {
      const Y = ui.goalYear, items = ((state.profile.goalItems || {})[Y] || []).filter(g => g.id !== id);
      state.profile.goalItems = Object.assign({}, state.profile.goalItems, { [Y]: items }); saveProfile(); break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'startform') {
    e.preventDefault();
    const birth = $('#st-birth').value;
    if (!parseD(birth)) { toast('Pon tu fecha de nacimiento para empezar.'); $('#st-birth').focus(); return; }
    startReal(birth, clamp(Math.round(num($('#st-exp').value)) || DEFAULT_E, 40, 120), $('#st-keep').checked, $('#st-country').value);
  } else if (f.id === 'tripform') {
    e.preventDefault(); runTrip(false);
  } else if (f.id === 'hdform') {
    e.preventDefault();
    const date = $('#hd-date').value, name = $('#hd-name').value.trim() || 'Feriado';
    if (!parseD(date)) { toast('Elige la fecha del feriado.'); $('#hd-date').focus(); return; }
    ui.hdOpen = true;
    state.profile.customHolidays = (state.profile.customHolidays || []).concat({ id: newId(), date, name: name.slice(0, 60), yearly: $('#hd-yearly').checked });
    saveProfile();
    toast(`Feriado agregado: ${name}.`);
  } else if (f.id === 'giform') {
    e.preventDefault();
    const inp = $('#gi-new'), text = inp.value.trim(); if (!text) return;
    const Y = ui.goalYear, items = ((state.profile.goalItems || {})[Y] || []).concat({ id: newId(), text, done:false });
    state.profile.goalItems = Object.assign({}, state.profile.goalItems, { [Y]: items });
    inp.value = ''; saveProfile();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.tf && ui.tripForm) ui.tripForm[el.dataset.tf] = el.value;
  if (el.dataset && 'rf' in el.dataset) ui.refineText = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && 'backup' in el.dataset) { const file = el.files && el.files[0]; el.value = ''; backupLoad(file); return; }
  if (el.dataset && el.dataset.photo && el.dataset.photo !== 'form') {
    const [kind, pid, di] = el.dataset.photo.split(':');
    const p = state.plans.find(x => x.id === pid); if (!p) return;
    const cur0 = kind === 'plan' ? (p.photos || []) : (((p.itinerary || {}).dias || [])[Number(di)] || {}).photos || [];
    const files = [...el.files]; el.value = '';
    addPhotos(files, MAX_PHOTOS - cur0.length).then(got => {
      if (!got.length) return;
      const fresh = state.plans.find(x => x.id === pid); if (!fresh) { got.forEach(dropPhoto); return; }
      const out = clone(fresh);
      if (kind === 'plan') out.photos = (out.photos || []).concat(got).slice(0, MAX_PHOTOS);
      else { const d = out.itinerary && out.itinerary.dias[Number(di)]; if (!d) { got.forEach(dropPhoto); return; } d.photos = (d.photos || []).concat(got); }
      savePlan(out);
      if (!state.example) toast(got.length === 1 ? 'Foto guardada.' : `${got.length} fotos guardadas.`);
    });
    return;
  }
  if (el.dataset && el.dataset.tp && ui.tripForm) {
    const s = new Set(ui.tripForm.people); el.checked ? s.add(el.dataset.tp) : s.delete(el.dataset.tp); ui.tripForm.people = [...s];
  } else if (el.dataset && el.dataset.gi) {
    const Y = ui.goalYear, items = ((state.profile.goalItems || {})[Y] || []).map(g => g.id === el.dataset.gi ? Object.assign({}, g, { done: el.checked }) : g);
    state.profile.goalItems = Object.assign({}, state.profile.goalItems, { [Y]: items }); saveProfile();
  }
});
view.addEventListener('mousemove', e => { if (e.target.id === 'lifegrid') gridHover(e); });
view.addEventListener('click', e => { if (e.target.id === 'lifegrid') gridHover(e); });
let rzT = null;
new ResizeObserver(() => { clearTimeout(rzT); rzT = setTimeout(() => { if (ui.tab === 'tiempo') drawGrid(); }, 80); }).observe(view);
const redrawTheme = () => { if (ui.tab === 'tiempo') drawGrid(); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawTheme); } catch {}
new MutationObserver(redrawTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawTheme);

boot();
</script>
</body>
